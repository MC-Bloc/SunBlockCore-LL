<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Not Found</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #0f1117;
      --surface:#1a1d27;
      --border: #2a2d3a;
      --text:   #e2e8f0;
      --muted:  #64748b;
      --accent: #f59e0b;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -2px;
    }
    .label {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }
    .hint {
      font-size: 0.875rem;
      color: var(--muted);
      max-width: 320px;
    }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 18px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 0.875rem;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }
    a:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <div class="label">Page not found</div>
  <div class="hint">The page you're looking for doesn't exist or has been moved.</div>
  <a href="/">← Back to SunBlock</a>
</body>
</html>
